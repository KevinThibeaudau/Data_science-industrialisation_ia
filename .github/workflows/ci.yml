
name: Tests API

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: uv sync --locked

      - name: Verifier la qualite du code
        run: uv run --no-sync ruff check app/ tests/

      - name: Executer les tests
        run: uv run --no-sync python -m pytest -v tests/
