
[project]
name = "tarification-auto"
version = "0.1.0"
description = "API de tarification automobile par Machine Learning"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "scikit-learn==1.7.0",
    "xgboost==3.4.1",
    "joblib==1.6.0",
]

[project.optional-dependencies]
train = [
    "optuna==5.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.5",
]

[tool.uv]
package = false
